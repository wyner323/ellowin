name: SLA sweep

# O plano Hobby da Vercel só permite cron diário (vercel.json roda às 03:00).
# Reembolsos automáticos por prazo de entrega, por SLA de disputa e a liberação
# automática ao vendedor dependem dessa varredura, então este agendamento chama
# a mesma rota a cada 15 minutos. Os horários do GitHub Actions podem atrasar
# alguns minutos em horários de pico — a varredura é idempotente, então chamar
# a mais ou com atraso não causa problema.
#
# Requer o segredo de repositório CRON_SECRET (o MESMO valor da variável
# CRON_SECRET na Vercel): Settings > Secrets and variables > Actions. Sem ele a
# execução FALHA (fica vermelha), para ninguém achar que a varredura está rodando.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sla-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/cron/sla
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            # Falha de propósito: sem o segredo nenhuma varredura roda a cada 15 minutos (só a diária da Vercel),
            # e um workflow verde que não fez nada esconde isso.
            echo "::error::Segredo CRON_SECRET não configurado no GitHub; varredura não executada."
            exit 1
          fi
          # O repositório é público e o corpo da resposta aparece neste log: a rota devolve só contagens
          # e a palavra "falhou" (o detalhe vai para o Sentry); um erro vira HTTP 500 e deixa a execução vermelha.
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ellowin.com.br/api/cron/sla
          echo
